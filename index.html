<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arrascordle</title>
<script>
try {
  var d = document.documentElement;
  var g = function (k) { try { return localStorage.getItem("arrascordle-" + k); } catch (e) { return null; } };
  var t = g("theme");
  if (t === "light" || (t === "auto" && matchMedia("(prefers-color-scheme: light)").matches)) d.dataset.theme = "light";
  var a = g("accent");
  if (/^#[0-9a-f]{6}$/i.test(a)) d.style.setProperty("--accent", a);
  var s = g("size");
  if (s === "small" || s === "large") d.dataset.size = s;
} catch (e) {}
</script>
<style>
  :root {
    --bg:#1f232a; --line:#343840; --card:#15181d; --btn:#171a1f; --btn-b:#1c2026; --btn-h:#1d2127; --btn-a:#12151a;
    --dis:#7d828b; --muted:#8d9096; --row:#181b20; --sub:#c3c8d3; --dash:#3a3f48; --dim:#6f747d; --fg:#fff;
    --pop:#15181d; --pop-b:#2a2f37; color-scheme: dark;
    --accent:#e0247f; --err:#e0247f; --s:1;
  }
  html[data-theme="light"] {
    --bg:#eef0f4; --line:#d5d9e0; --card:#ffffff; --btn:#f3f4f7; --btn-b:#d3d8e0; --btn-h:#e8ebf0; --btn-a:#dde1e8;
    --dis:#a0a6b0; --muted:#6b717c; --row:#f3f5f8; --sub:#4a505b; --dash:#b8bec9; --dim:#8a909a; --fg:#1b1f26;
    --pop:#ffffff; --pop-b:#d5d9e0; color-scheme: light;
  }
  html[data-size="small"] { --s:.8; }
  html[data-size="large"] { --s:1.15; }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    background: var(--bg);
    border-top: 1px solid var(--line);
    color: var(--fg);
    font-family: "Noto Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    padding: 60px 16px 70px;
  }
  .hidden { display: none !important; }
  #status { margin-top: 14px; font-size: 14px; line-height: 20px; color: var(--muted); min-height: 20px; }
  #status.err { color: var(--err); }
  #start .card { width: 270px; }
  .hint { font-size: 12px; color: var(--dim); margin-top: 14px; line-height: 18px; }

  /* ---------- start screen ---------- */
  #start { display: flex; justify-content: center; }
  .card { background: var(--card); border-radius: 8px; padding: 21px; text-align: center; }
  h1 { margin: 0 0 18px; font-size: 24px; font-weight: 700; line-height: 36px; letter-spacing: -.2px; }

  button {
    width: 100%; height: 48px;
    background: var(--btn); border: 1px solid var(--btn-b); border-radius: 4px;
    color: var(--fg); font: inherit; font-size: 17px; font-weight: 600;
    cursor: pointer; transition: background .15s;
  }
  button:hover:not(:disabled) { background: var(--btn-h); }
  button:active:not(:disabled) { background: var(--btn-a); }
  button:disabled { cursor: not-allowed; color: var(--dis); }

  /* ---------- result screen ---------- */
  #best {
    text-align: center; color: var(--muted); font-weight: 700; font-size: 18px;
    margin: -18px 0 22px; line-height: 28px; min-height: 28px;
  }
  .layout { display: flex; justify-content: center; align-items: flex-start; gap: 40px; flex-wrap: wrap; }
  .layout.fade { animation: fadein .45s ease both; }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .left { width: 250px; padding: 24px 21px 21px; }
  .left h2 { margin: 0 0 24px; font-size: 24px; line-height: 30px; font-weight: 700; }
  .img {
    width: 180px; height: 180px; margin: 0 auto 36px;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); border: 2px dashed var(--dash); border-radius: 50%;
    animation: spin 12s linear infinite;
    color: var(--dim); font-size: 15px; overflow: hidden;
  }
  .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .left button { margin-bottom: 22px; }
  .left .hint { margin-top: -6px; }

  .right { width: 630px; max-width: 100%; padding: 20px; }
  .head { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 4px 0 20px; }
  @property --a { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  .score {
    position: relative; font-size: 30px; font-weight: 300; color: var(--accent);
    text-shadow: 0 0 14px color-mix(in srgb, var(--accent) 45%, transparent);
    padding: 4px 20px; border-radius: 16px; line-height: 38px;
  }
  /* comet trail orbiting the score */
  .score::before, .score::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 2px;
    background: conic-gradient(from var(--a), transparent 0deg, transparent 200deg,
      color-mix(in srgb, var(--accent) 25%, transparent) 270deg,
      color-mix(in srgb, var(--accent) 70%, white) 350deg, #fff 360deg);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    animation: orbit 2.4s linear infinite; pointer-events: none;
  }
  .score::after { filter: blur(6px); }
  @keyframes orbit { to { --a: 360deg; } }
  .rank {
    font-size: 15px; color: var(--accent); border: 1px solid var(--accent);
    border-radius: 10px; padding: 2px 14px; line-height: 26px;
  }
  .ach {
    background: var(--row); border-radius: 8px;
    padding: calc(22px * var(--s)) calc(20px * var(--s));
    display: flex; justify-content: space-between; align-items: center; gap: 20px;
    margin-bottom: calc(20px * var(--s)); text-align: left;
  }
  .ach:last-child { margin-bottom: 0; }
  .ach .name { font-size: calc(22px * var(--s)); font-weight: 600; line-height: calc(30px * var(--s)); }
  .ach .desc { font-size: calc(18px * var(--s)); color: var(--sub); line-height: calc(30px * var(--s)); }
  .ach .pts { font-size: calc(18px * var(--s)); font-weight: 500; color: var(--sub); white-space: nowrap; }
  .shuffling #achs { opacity: .5; }
  .shuffling .score, .shuffling #name { filter: blur(.6px); }

  /* ---------- settings ---------- */
  #gear { position: fixed; top: 14px; right: 14px; z-index: 20; width: 42px; height: 42px; padding: 0; font-size: 20px; line-height: 1; border-radius: 50%; }
  #colBtn { position: fixed; top: 14px; left: 14px; z-index: 20; width: auto; height: 42px; padding: 0 16px; font-size: 15px; line-height: 1; border-radius: 21px; }
  #settings {
    position: fixed; top: 64px; right: 14px; z-index: 20; width: 320px; max-width: calc(100vw - 28px);
    max-height: calc(100vh - 80px); overflow: auto;
    background: var(--pop); border: 1px solid var(--pop-b); border-radius: 10px; padding: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,.35); text-align: left;
  }
  #settings section + section { margin-top: 18px; }
  #settings h3 { margin: 0 0 8px; font-size: 13px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); }
  .seg { display: flex; gap: 8px; }
  .seg button { height: 36px; font-size: 14px; }
  .seg button.on { border-color: var(--accent); color: var(--accent); }

  .sw { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .sw button { width: 30px; height: 30px; padding: 0; border-radius: 50%; border: 2px solid var(--btn-b); }
  .sw button.on { outline: 2px solid var(--fg); outline-offset: 2px; }
  .sw input[type=color] { width: 30px; height: 30px; padding: 0; border: none; background: none; cursor: pointer; }

  .vol { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; color: var(--sub); }
  .vol input { flex: 1; accent-color: var(--accent); }

  .statline { font-size: 13px; color: var(--sub); margin-bottom: 8px; }
  .hist { max-height: 110px; overflow: auto; font-size: 13px; color: var(--sub); background: var(--row); border-radius: 6px; padding: 6px 10px; margin-bottom: 10px; }
  .hist div { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
  .rst { display: flex; flex-direction: column; gap: 8px; }
  .rst button { height: 34px; font-size: 13px; }

  /* ---------- luck pill ---------- */
  #luck {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
    font-size: 13px; color: var(--muted); background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 4px 14px; white-space: nowrap; cursor: help;
  }
  #luck.hot { color: var(--accent); border-color: var(--accent); }

  /* ---------- toast ---------- */
  #toast {
    position: fixed; top: 14px; left: 50%; z-index: 40; transform: translate(-50%, -150%);
    background: var(--pop); border: 1px solid var(--accent); border-radius: 10px; padding: 10px 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,.4); text-align: center; max-width: calc(100vw - 28px);
    transition: transform .35s ease; pointer-events: none;
  }
  #toast.show { transform: translate(-50%, 0); }
  #toast b { display: block; font-size: 12px; letter-spacing: .6px; text-transform: uppercase; color: var(--accent); }
  #toast span { font-size: 15px; font-weight: 600; }
  #toast small { display: block; font-size: 13px; color: var(--sub); }

  /* ---------- collection ---------- */
  #coll { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .cpanel { background: var(--pop); border: 1px solid var(--pop-b); border-radius: 12px; width: 820px; max-width: 100%; max-height: 90vh; overflow: auto; padding: 20px; text-align: left; }
  .chead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .cpanel h2 { margin: 0; font-size: 22px; line-height: 32px; }
  .cpanel h2 span { color: var(--accent); font-weight: 400; margin-left: 6px; }
  .cpanel h2.sub { margin: 24px 0 12px; }
  #cclose { width: 36px; height: 36px; padding: 0; font-size: 22px; line-height: 1; border-radius: 50%; }
  #cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 12px; }
  .tile { position: relative; background: var(--row); border: 2px solid transparent; border-radius: 10px; padding: 12px 6px 10px; text-align: center; }
  .tile.cur { border-color: var(--accent); }
  .tile.top { box-shadow: 0 0 14px color-mix(in srgb, #e0a100 55%, transparent); }
  .tile .timg { width: 64px; height: 64px; margin: 0 auto 8px; border-radius: 50%; overflow: hidden; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 22px; }
  .tile .timg img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile.locked .timg img { filter: brightness(0) opacity(.3); }
  .tile .tn { font-size: 13px; font-weight: 600; line-height: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .ts { font-size: 12px; color: var(--sub); line-height: 18px; }
  .tile.locked .tn, .tile.locked .ts { color: var(--dim); }
  .tile .tc { position: absolute; top: 6px; right: 8px; font-size: 11px; color: var(--accent); font-weight: 700; }
  #blist { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .bdg { background: var(--row); border-radius: 8px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; }
  .bdg .bi { font-size: 22px; }
  .bdg .bn { font-size: 14px; font-weight: 600; line-height: 20px; }
  .bdg .bd { font-size: 12px; color: var(--sub); line-height: 17px; }
  .bdg.locked { opacity: .55; }
</style>
</head>
<body>

  <!-- collection button + settings -->
  <button id="colBtn" title="Collection (C)" aria-label="Collection">&#9638; <span id="colN">0/0</span></button>
  <button id="gear" title="Settings" aria-label="Settings">&#9881;</button>
  <div id="settings" class="hidden">
    <section>
      <h3>Theme</h3>
      <div class="seg" data-key="theme">
        <button data-v="dark">Dark</button>
        <button data-v="light">Light</button>
        <button data-v="auto">Auto</button>
      </div>
    </section>
    <section>
      <h3>Accent colour</h3>
      <div class="sw" id="sw">
        <button data-c="#e0247f" style="background:#e0247f" title="Pink" aria-label="Pink"></button>
        <button data-c="#2f7df6" style="background:#2f7df6" title="Blue" aria-label="Blue"></button>
        <button data-c="#1fae6b" style="background:#1fae6b" title="Green" aria-label="Green"></button>
        <button data-c="#e0a100" style="background:#e0a100" title="Gold" aria-label="Gold"></button>
        <button data-c="#8b5cf6" style="background:#8b5cf6" title="Purple" aria-label="Purple"></button>
        <input type="color" id="accentPick" title="Custom colour" aria-label="Custom colour">
      </div>
    </section>
    <section>
      <h3>Text size</h3>
      <div class="seg" data-key="size">
        <button data-v="small">Small</button>
        <button data-v="normal">Normal</button>
        <button data-v="large">Large</button>
      </div>
    </section>
    <section>
      <h3>Reveal animation</h3>
      <div class="seg" data-key="reveal">
        <button data-v="none">None</button>
        <button data-v="fade">Fade</button>
        <button data-v="shuffle">Shuffle</button>
      </div>
    </section>
    <section>
      <h3>Number format</h3>
      <div class="seg" data-key="num">
        <button data-v="full">Full</button>
        <button data-v="compact">Compact (1.2k)</button>
      </div>
    </section>
    <section>
      <h3>Sound</h3>
      <div class="seg" data-key="sound">
        <button data-v="on">On</button>
        <button data-v="off">Off</button>
      </div>
      <div class="vol"><span>Volume</span><input type="range" id="vol" min="0" max="100" step="5" aria-label="Volume"></div>
    </section>
    <section>
      <h3>Data</h3>
      <div class="statline" id="stats"></div>
      <div class="hist" id="hist"></div>
      <div class="rst">
        <button id="rstBest">Reset best roll</button>
        <button id="rstHist">Reset history</button>
        <button id="rstStats">Reset stats</button>
        <button id="rstColl">Reset collection</button>
        <button id="rstBadges">Reset badges</button>
      </div>
    </section>
  </div>

  <!-- collection modal -->
  <div id="coll" class="hidden">
    <div class="cpanel">
      <div class="chead">
        <h2>Collection <span id="ccount"></span></h2>
        <button id="cclose" aria-label="Close">&times;</button>
      </div>
      <div id="cgrid"></div>
      <h2 class="sub">Badges <span id="bcount"></span></h2>
      <div id="blist"></div>
    </div>
  </div>

  <div id="toast"></div>
  <div id="luck"></div>

  <!-- start screen -->
  <div id="start">
    <div class="card">
      <h1>Arrascordle</h1>
      <button id="rollStart" disabled>Roll an user</button>
      <div class="hint">Space / R = roll &middot; C = collection</div>
      <div id="status"></div>
    </div>
  </div>

  <!-- result screen -->
  <div id="result" class="hidden">
    <div id="best"></div>
    <div class="layout" id="layout">
      <div class="card left">
        <h2 id="name"></h2>
        <div class="img" id="img"></div>
        <button id="rollAgain">Roll Again</button>
        <button id="export">Export</button>
        <div class="hint">Space / R = roll &middot; C = collection</div>
      </div>
      <div class="card right">
        <div class="head">
          <div class="score" id="score"></div>
          <div class="rank" id="rank"></div>
        </div>
        <div id="achs"></div>
      </div>
    </div>
  </div>

<script src="info/index.js"></script>
<script>
  /*
    Data layout:
      info/
        achievements.csv       <- master list: Achievements,Desc,Points
        users.csv              <- id,name,achievements  (achievements separated by ;)
        pfp/                   <- 1.png, 2.png, ... (file name = the user's id in users.csv)
    After editing anything in info/, run build.py -> regenerates info/index.js
  */
  const COOLDOWN = 0;  // seconds
  const MSG_POINTS = 1; // points per message sent
  const HISTORY_MAX = 20;
  // luck / pity: every roll outside the top TOP_N adds 1 pity.
  // Each pity point makes top-TOP_N users (1 + pity*PITY_STEP)x more likely. At PITY_HARD the next roll is guaranteed top-TOP_N.
  const TOP_N = 5, PITY_STEP = 0.4, PITY_HARD = 12;
  const $ = id => document.getElementById(id);
  const rollAgain = $("rollAgain"), exportBtn = $("export"), statusEl = $("status");
  let USERS = [], current = null, last = null, timer = null, LOW = Infinity;
  let revealing = false, revTimer = null;
  let best = { name: "", points: -Infinity };
  try { const b = JSON.parse(localStorage.getItem("arrascordle-best")); if (b && b.name) best = b; } catch {}
  // cooldown survives refresh: time (ms) when the next roll is allowed
  let nextAt = 0;
  try { nextAt = parseInt(localStorage.getItem("arrascordle-next")) || 0; } catch {}
  nextAt = Math.min(nextAt, Date.now() + COOLDOWN * 1000); // ignore clock tampering

  // ---------- storage + settings state ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem("arrascordle-" + k); return v === null ? d : v; } catch { return d; } },
    set(k, v) { try { localStorage.setItem("arrascordle-" + k, v); } catch {} },
    del(k)    { try { localStorage.removeItem("arrascordle-" + k); } catch {} },
    load(k, d) { try { const v = JSON.parse(localStorage.getItem("arrascordle-" + k)); return v == null ? d : v; } catch { return d; } },
    save(k, v) { try { localStorage.setItem("arrascordle-" + k, JSON.stringify(v)); } catch {} },
  };
  const pick = (v, ok, d) => ok.includes(v) ? v : d;
  const S = {
    theme:  pick(store.get("theme"), ["dark", "light", "auto"], "dark"),
    accent: store.get("accent", "#e0247f"),
    size:   pick(store.get("size"), ["small", "normal", "large"], "normal"),
    reveal: pick(store.get("reveal"), ["none", "fade", "shuffle"], "fade"),
    num:    pick(store.get("num"), ["full", "compact"], "full"),
    sound:  pick(store.get("sound"), ["on", "off"], "on"),
    vol:    parseFloat(store.get("vol", "0.5")),
  };
  if (!/^#[0-9a-f]{6}$/i.test(S.accent)) S.accent = "#e0247f";
  if (isNaN(S.vol)) S.vol = 0.5;
  S.vol = Math.min(1, Math.max(0, S.vol));

  let history = store.load("history", []);
  if (!Array.isArray(history)) history = [];
  let stats = store.load("stats", null);
  if (!stats || typeof stats !== "object") stats = {};
  stats = { rolls: +stats.rolls || 0, sum: +stats.sum || 0, seen: Array.isArray(stats.seen) ? stats.seen : [] };

  // collection: { userName: timesRolled }  (migrates from the old "seen" list)
  let coll = store.load("coll", null);
  if (!coll || typeof coll !== "object" || Array.isArray(coll)) { coll = {}; stats.seen.forEach(n => coll[n] = 1); store.save("coll", coll); }
  // earned hidden badges: { badgeId: timestamp }
  let earned = store.load("badges", {});
  if (!earned || typeof earned !== "object" || Array.isArray(earned)) earned = {};
  // pity counter: rolls since the last top-TOP_N roll
  let pity = Math.max(0, parseInt(store.get("pity", "0")) || 0);

  // ---------- number format ----------
  function fmt(n) {
    if (S.num !== "compact" || Math.abs(n) < 1000) return String(n);
    for (const [v, s] of [[1e3, "k"], [1e6, "M"], [1e9, "B"]]) {
      const r = Math.round(n / v * 10) / 10;
      if (Math.abs(r) < 1000 || s === "B") return r + s;
    }
  }

  // ---------- CSV ----------
  function parseLine(line, d) {
    const out = []; let cur = "", q = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (q) { if (c === '"') { if (line[i+1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
      else if (c === '"') q = true;
      else if (c === d) { out.push(cur.trim()); cur = ""; }
      else cur += c;
    }
    out.push(cur.trim());
    return out;
  }
  function parseAchievements(text) {
    const lines = text.replace(/^\uFEFF/, "").split(/\r?\n/).filter(l => l.trim());
    const rows = lines.map(l => {
      let r = [l.includes("\t") ? "\t" : l.includes(",") ? "," : l.includes(";") ? ";" : null]
        .map(d => d ? parseLine(l, d) : l.trim().split(/\s{2,}/))[0];
      return r;
    }).filter(r => r.length >= 2);
    const num = v => parseInt(String(v).replace(/[^\d-]/g, ""), 10);
    const out = [];
    rows.forEach((r, i) => {
      const pts = num(r[r.length - 1]);
      if (isNaN(pts)) { if (i === 0) return; /* header */ else return; }
      const name = r[0], desc = r.length > 2 ? r.slice(1, -1).join(", ") : "";
      out.push({ name, desc, pts });
    });
    return out;
  }

  // ---------- load (from info/index.js, made by build.py) ----------
  function parseList(text) {
    const names = text.replace(/^\uFEFF/, "").split(/\r?\n/)
      .map(l => l.trim().replace(/^"(.*)"$/, "$1").trim()).filter(Boolean);
    if (names.length && /^achievements?$/i.test(names[0])) names.shift(); // header
    return names;
  }
  function init() {
    const data = window.INFO;
    if (!data || !Array.isArray(data.users) || !data.users.length) {
      statusEl.className = "err";
      statusEl.textContent = "No users found. Run build.py to generate info/index.js";
      return;
    }
    // master list: Achievements, Desc, Points
    const master = new Map(parseAchievements(data.master || "").map(a => [a.name.trim().toLowerCase(), a]));
    USERS = data.users.map(d => {
      const achievements = parseList(d.list || "").map(n => master.get(n.toLowerCase()) || { name: n, desc: "", pts: 0 })
        .sort((a, b) => b.pts - a.pts); // largest -> smallest
      const badgeCount = achievements.length; // real badges only (no "Messages" row)
      const messages = parseInt(d.messages) || 0;
      if (messages > 0) achievements.unshift({ name: "Messages", desc: `Sent ${messages.toLocaleString()} messages in the server.`, pts: messages * MSG_POINTS });
      return { name: d.name, achievements, badgeCount, image: d.image ? encodeURI(d.image) : null,
               points: achievements.reduce((t, a) => t + a.pts, 0) };
    });
    USERS.forEach(u => u.rank = 1 + USERS.filter(o => o.points > u.points).length);
    LOW = Math.min(...USERS.map(u => u.points));
    $("rollStart").disabled = false;
  }
  init();
  if (nextAt > Date.now()) startCooldown();

  // ---------- sound (synthesized, no files needed) ----------
  let actx = null;
  function beep(freq, t0, dur, type, gain) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function playRoll(ticks) {
    if (S.sound !== "on" || S.vol <= 0) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      const t = actx.currentTime + 0.01, v = S.vol * 0.25;
      let at = 0;
      if (ticks) {
        for (let i = 0; i < 9; i++) { beep(280 + i * 60, t + i * 0.075, 0.05, "square", v * 0.5); }
        at = 0.8;
      }
      beep(660, t + at, 0.16, "triangle", v);
      beep(990, t + at + 0.08, 0.32, "triangle", v);
    } catch {}
  }
  function playBadge() {
    if (S.sound !== "on" || S.vol <= 0) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      const t = actx.currentTime + 0.01, v = S.vol * 0.25;
      [523, 659, 784, 1047].forEach((f, i) => beep(f, t + i * 0.09, 0.28, "triangle", v));
    } catch {}
  }

  // ---------- luck / pity ----------
  function weights() { return USERS.map(u => u.rank <= TOP_N ? 1 + pity * PITY_STEP : 1); }
  function topOdds() {
    if (!USERS.length) return 0;
    if (pity >= PITY_HARD) return 1;
    const w = weights(), tot = w.reduce((a, b) => a + b, 0);
    return USERS.reduce((s, u, i) => s + (u.rank <= TOP_N ? w[i] : 0), 0) / tot;
  }
  function pickUser() {
    if (pity >= PITY_HARD) {
      const pool = USERS.filter(u => u.rank <= TOP_N);
      return pool[Math.floor(Math.random() * pool.length)];
    }
    const w = weights(); let r = Math.random() * w.reduce((a, b) => a + b, 0);
    for (let i = 0; i < USERS.length; i++) { r -= w[i]; if (r < 0) return USERS[i]; }
    return USERS[USERS.length - 1];
  }
  function updateLuck() {
    const el = $("luck");
    if (!USERS.length) { el.classList.add("hidden"); return; }
    el.classList.remove("hidden");
    const odds = topOdds();
    el.textContent = pity >= PITY_HARD
      ? `\u{1F340} Guaranteed top ${TOP_N} next roll!`
      : `\u{1F340} Top ${TOP_N} odds ${Math.round(odds * 100)}%` + (pity > 0 ? ` \u00B7 pity ${pity}/${PITY_HARD}` : "");
    el.classList.toggle("hot", pity > 0);
    el.title = `Every roll outside the top ${TOP_N} adds pity and boosts your odds of a top ${TOP_N} user. At ${PITY_HARD} pity the next roll is guaranteed.`;
  }

  // ---------- hidden badges ----------
  // c = { u, pityBefore, hist (newest first), low, total, seen }
  const top3 = (c, f) => c.hist.length >= 3 && c.hist.slice(0, 3).every(f);
  const BADGES = [
    { id: "underdog",   icon: "\u{1F415}", name: "Underdog",       desc: "Rolled the lowest-scoring user.",              test: c => c.u.points === c.low },
    { id: "rockbottom", icon: "\u{1FAA8}", name: "Rock Bottom",    desc: "Rolled the lowest-scoring user 3 times in a row.", test: c => top3(c, h => h.points === c.low) },
    { id: "topdog",     icon: "\u{1F451}", name: "Top Dog",        desc: "Rolled the #1 user.",                          test: c => c.u.rank === 1 },
    { id: "doubletop",  icon: "\u{1F525}", name: "Double Top",     desc: "Rolled the #1 user twice in a row.",           test: c => c.hist.length >= 2 && c.hist[0].rank === 1 && c.hist[1].rank === 1 },
    { id: "hoarder",    icon: "\u{1F396}", name: "Badge Hoarder",  desc: "Rolled someone with 5+ badges.",               test: c => c.u.badgeCount >= 5 },
    { id: "heavy",      icon: "\u{1F4A5}", name: "Heavy Hitter",   desc: "Rolled someone with over 20,000 points.",      test: c => c.u.points > 20000 },
    { id: "dejavu",     icon: "\u{1F300}", name: "Deja Vu",        desc: "Rolled the same user 3 times in a row.",       test: c => c.hist.length >= 3 && c.hist.slice(0, 3).every(h => h.name === c.hist[0].name) },
    { id: "hotstreak",  icon: "\u{1F340}", name: "Hot Streak",     desc: `Rolled a top ${TOP_N} user 3 times in a row.`, test: c => top3(c, h => h.rank <= TOP_N) },
    { id: "climber",    icon: "\u{1F4C8}", name: "Climber",        desc: "Each of 3 rolls scored higher than the last.", test: c => c.hist.length >= 3 && c.hist[0].points > c.hist[1].points && c.hist[1].points > c.hist[2].points },
    { id: "bounce",     icon: "\u{1F938}", name: "Bounce Back",    desc: "Rolled the lowest user, then the #1 user.",    test: c => c.hist.length >= 2 && c.hist[1].points === c.low && c.hist[0].rank === 1 },
    { id: "finally",    icon: "\u{1F64F}", name: "Finally!",       desc: "Hit a top user after 10+ rolls of bad luck.",  test: c => c.pityBefore >= 10 && c.u.rank <= TOP_N },
    { id: "half",       icon: "\u{1F4D8}", name: "Collector",      desc: "Rolled half of all users.",                    test: c => c.seen * 2 >= USERS.length },
    { id: "complete",   icon: "\u{1F3C6}", name: "Completionist",  desc: "Rolled every single user.",                    test: c => c.seen >= USERS.length },
    { id: "regular",    icon: "\u{1F3B2}", name: "Regular",        desc: "Rolled 25 times.",                             test: c => c.total >= 25 },
    { id: "addict",     icon: "\u{1F92A}", name: "Roll Addict",    desc: "Rolled 100 times.",                            test: c => c.total >= 100 },
    { id: "owl",        icon: "\u{1F989}", name: "Night Owl",      desc: "Rolled between 2 and 5 AM.",                   test: () => { const h = new Date().getHours(); return h >= 2 && h < 5; } },
  ];
  function collCount() { return USERS.filter(u => coll[u.name]).length; }
  function checkBadges(extra) {
    const c = { ...extra, hist: history, low: LOW, total: stats.rolls, seen: collCount() };
    const out = [];
    BADGES.forEach(b => {
      if (earned[b.id]) return;
      let ok = false; try { ok = b.test(c); } catch {}
      if (ok) { earned[b.id] = Date.now(); out.push(b); }
    });
    if (out.length) store.save("badges", earned);
    return out;
  }

  // toast queue
  const toasts = []; let toasting = false;
  function toast(b) { toasts.push(b); if (!toasting) nextToast(); }
  function nextToast() {
    const b = toasts.shift(), el = $("toast");
    if (!b) { toasting = false; return; }
    toasting = true;
    el.innerHTML = "";
    const h = document.createElement("b"); h.textContent = "Hidden badge unlocked";
    const n = document.createElement("span"); n.textContent = `${b.icon} ${b.name}`;
    const d = document.createElement("small"); d.textContent = b.desc;
    el.append(h, n, d);
    void el.offsetWidth; el.classList.add("show");
    playBadge();
    setTimeout(() => { el.classList.remove("show"); setTimeout(nextToast, 450); }, 3400);
  }

  // ---------- collection ----------
  function updateColBtn() { $("colN").textContent = `${collCount()}/${USERS.length}`; }
  function renderColl() {
    const grid = $("cgrid"); grid.innerHTML = "";
    USERS.forEach(u => {
      const n = coll[u.name] || 0;
      const t = document.createElement("div");
      t.className = "tile" + (n ? "" : " locked") + (n && u.rank === 1 ? " top" : "") + (n && current === u ? " cur" : "");
      const im = document.createElement("div"); im.className = "timg";
      if (u.image) { const i = document.createElement("img"); i.src = u.image; i.alt = ""; im.appendChild(i); }
      else im.textContent = "?";
      const tn = document.createElement("div"); tn.className = "tn"; tn.textContent = n ? u.name : "???";
      const ts = document.createElement("div"); ts.className = "ts"; ts.textContent = n ? `${fmt(u.points)} \u00B7 #${u.rank}` : "Not rolled";
      t.append(im, tn, ts);
      if (n > 1) { const c = document.createElement("div"); c.className = "tc"; c.textContent = "\u00D7" + n; t.appendChild(c); }
      grid.appendChild(t);
    });
    $("ccount").textContent = `${collCount()}/${USERS.length}`;
    const bl = $("blist"); bl.innerHTML = "";
    BADGES.forEach(b => {
      const got = earned[b.id];
      const row = document.createElement("div"); row.className = "bdg" + (got ? "" : " locked");
      const bi = document.createElement("div"); bi.className = "bi"; bi.textContent = got ? b.icon : "\u{1F512}";
      const tx = document.createElement("div");
      const bn = document.createElement("div"); bn.className = "bn"; bn.textContent = got ? b.name : "???";
      const bd = document.createElement("div"); bd.className = "bd";
      bd.textContent = got ? `${b.desc} (${new Date(got).toLocaleDateString()})` : "Hidden badge";
      tx.append(bn, bd); row.append(bi, tx); bl.appendChild(row);
    });
    $("bcount").textContent = `${BADGES.filter(b => earned[b.id]).length}/${BADGES.length}`;
  }
  const collOpen = () => !$("coll").classList.contains("hidden");
  function openColl() { renderColl(); $("coll").classList.remove("hidden"); }
  function closeColl() { $("coll").classList.add("hidden"); }

  // ---------- render ----------
  function paint(u, withImg = true) {
    $("name").textContent = u.name;
    $("score").textContent = fmt(u.points);
    $("rank").textContent = "#" + u.rank;
    if (withImg) {
      const img = $("img"); img.innerHTML = "";
      if (u.image) { const i = document.createElement("img"); i.src = u.image; i.alt = u.name; img.appendChild(i); }
      else img.textContent = "image";
    }
    const box = $("achs"); box.innerHTML = "";
    u.achievements.forEach(a => {
      const row = document.createElement("div"); row.className = "ach";
      const l = document.createElement("div");
      const n = document.createElement("div"); n.className = "name"; n.textContent = a.name;
      const d = document.createElement("div"); d.className = "desc"; d.textContent = a.desc;
      l.append(n, d);
      const p = document.createElement("div"); p.className = "pts"; p.textContent = (a.pts >= 0 ? "+" : "") + fmt(a.pts);
      row.append(l, p); box.appendChild(row);
    });
  }
  function updateBest() {
    $("best").textContent = best.name ? `Best roll: ${best.name}(${fmt(best.points)})` : "";
  }
  function render(u) { paint(u); updateBest(); }

  // ---------- reveal animation ----------
  function revealMode() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return "none";
    if (S.reveal === "shuffle" && USERS.length < 3) return "fade";
    return S.reveal;
  }
  function reveal(u, mode) {
    clearTimeout(revTimer);
    const layout = $("layout"), result = $("result");
    layout.classList.remove("fade");
    if (mode === "shuffle") {
      revealing = true; result.classList.add("shuffling");
      const N = 10; let i = 0, prev = null;
      const step = () => {
        if (i < N) {
          let r; do { r = USERS[Math.floor(Math.random() * USERS.length)]; } while (r === prev || r === u);
          prev = r; paint(r, false);
          i++; revTimer = setTimeout(step, 40 + i * 8);
        } else {
          revealing = false; result.classList.remove("shuffling");
          render(u);
        }
      };
      step();
    } else {
      render(u);
      if (mode === "fade") { void layout.offsetWidth; layout.classList.add("fade"); }
    }
  }

  function startCooldown() {
    clearInterval(timer);
    const tick = () => {
      const left = Math.ceil((nextAt - Date.now()) / 1000);
      if (left <= 0) {
        clearInterval(timer);
        rollAgain.disabled = false; rollAgain.textContent = "Roll Again";
        $("rollStart").disabled = !USERS.length; $("rollStart").textContent = "Roll an user";
      } else {
        rollAgain.disabled = true; rollAgain.textContent = `Roll Again (${left})`;
        $("rollStart").disabled = true; $("rollStart").textContent = `Roll an user (${left})`;
      }
    };
    tick();
    if (nextAt > Date.now()) timer = setInterval(tick, 250);
  }

  // ---------- history + stats ----------
  function record(u) {
    history.unshift({ name: u.name, points: u.points, rank: u.rank });
    if (history.length > HISTORY_MAX) history.length = HISTORY_MAX;
    stats.rolls++; stats.sum += u.points;
    if (!stats.seen.includes(u.name)) stats.seen.push(u.name);
    store.save("history", history); store.save("stats", stats);
    renderData();
  }
  function renderData() {
    $("stats").textContent = stats.rolls
      ? `Rolls ${stats.rolls} \u00B7 Avg ${fmt(Math.round(stats.sum / stats.rolls))} \u00B7 Seen ${collCount()}/${USERS.length || "?"}`
      : "No rolls yet.";
    const box = $("hist"); box.innerHTML = "";
    if (!history.length) { box.textContent = "No history yet."; return; }
    history.forEach(h => {
      const row = document.createElement("div");
      const a = document.createElement("span"); a.textContent = h.name;
      const b = document.createElement("span"); b.textContent = `${fmt(h.points)} \u00B7 #${h.rank}`;
      row.append(a, b); box.appendChild(row);
    });
  }

  function roll() {
    if (!USERS.length || Date.now() < nextAt || revealing) return;
    const pityBefore = pity;
    current = last = pickUser();
    if (current.points > best.points) {
      best = { name: current.name, points: current.points };
      try { localStorage.setItem("arrascordle-best", JSON.stringify(best)); } catch {}
    }
    record(current);
    pity = current.rank <= TOP_N ? 0 : pity + 1;
    store.set("pity", String(pity));
    coll[current.name] = (coll[current.name] || 0) + 1;
    store.save("coll", coll);
    const fresh = checkBadges({ u: current, pityBefore });
    nextAt = Date.now() + COOLDOWN * 1000;
    try { localStorage.setItem("arrascordle-next", String(nextAt)); } catch {}
    $("start").classList.add("hidden");
    $("result").classList.remove("hidden");
    startCooldown();
    const mode = revealMode();
    playRoll(mode === "shuffle");
    reveal(current, mode);
    // update luck, collection counter and badge toasts once the reveal is done (no spoilers)
    setTimeout(() => { updateLuck(); updateColBtn(); renderData(); fresh.forEach(toast); }, mode === "shuffle" ? 1400 : 500);
  }

  $("rollStart").onclick = roll;
  rollAgain.onclick = () => { if (!rollAgain.disabled) roll(); };

  exportBtn.onclick = async () => {
    if (!current || revealing) return;
    const extra = current.achievements.length - 3;
    const text =
      `**${current.name}**\n${current.points} score #${current.rank}\n\n` +
      current.achievements.slice(0, 3).map(a => `${a.name} ${a.pts >= 0 ? "+" : ""}${a.pts}`).join("\n") +
      (extra > 0 ? `\n+${extra} more badge${extra > 1 ? "s" : ""}` : "") +
      "\n\nArrascordle\nhttps://shortcut1power.github.io/arrascordle/";
    try { await navigator.clipboard.writeText(text); }
    catch {
      const t = document.createElement("textarea");
      t.value = text; document.body.appendChild(t); t.select();
      document.execCommand("copy"); t.remove();
    }
    exportBtn.textContent = "Copied!";
    setTimeout(() => exportBtn.textContent = "Export", 1200);
  };

  // ---------- keyboard shortcuts ----------
  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target;
    if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    const k = e.key.toLowerCase();
    if (k === "escape") { closeColl(); return; }
    if (k === "c") { collOpen() ? closeColl() : openColl(); return; }
    if (k === " " || k === "r") {
      if (collOpen() || !$("settings").classList.contains("hidden")) return;
      e.preventDefault();
      if (t && t.tagName === "BUTTON") t.blur(); // stop Space from also "clicking" the focused button
      if (e.repeat) return;
      roll();
    }
  });
  $("colBtn").onclick = e => { e.stopPropagation(); collOpen() ? closeColl() : openColl(); };
  $("cclose").onclick = closeColl;
  $("coll").onclick = e => { if (e.target === $("coll")) closeColl(); };

  // ---------- settings ----------
  (function () {
    const root = document.documentElement;
    const mq = matchMedia("(prefers-color-scheme: light)");

    function markSeg(key) {
      document.querySelectorAll(`.seg[data-key="${key}"] button`)
        .forEach(b => b.classList.toggle("on", b.dataset.v === S[key]));
    }
    function applyTheme() {
      const light = S.theme === "light" || (S.theme === "auto" && mq.matches);
      if (light) root.dataset.theme = "light"; else delete root.dataset.theme;
      markSeg("theme");
    }
    function applyAccent() {
      root.style.setProperty("--accent", S.accent);
      $("accentPick").value = S.accent;
      document.querySelectorAll("#sw button").forEach(b => b.classList.toggle("on", b.dataset.c === S.accent.toLowerCase()));
    }
    function applySize() {
      if (S.size === "normal") delete root.dataset.size; else root.dataset.size = S.size;
      markSeg("size");
    }
    function rerender() {
      if (current && !revealing) render(current);
      renderData();
      if (collOpen()) renderColl();
    }

    document.querySelectorAll(".seg").forEach(seg => {
      const key = seg.dataset.key;
      seg.querySelectorAll("button").forEach(b => b.onclick = () => {
        S[key] = b.dataset.v; store.set(key, S[key]); markSeg(key);
        if (key === "theme") applyTheme();
        else if (key === "size") applySize();
        else if (key === "num") rerender();
        else if (key === "sound" && S.sound === "on") playRoll(false); // preview
      });
    });

    document.querySelectorAll("#sw button").forEach(b => b.onclick = () => {
      S.accent = b.dataset.c; store.set("accent", S.accent); applyAccent();
    });
    $("accentPick").oninput = e => { S.accent = e.target.value; store.set("accent", S.accent); applyAccent(); };

    const vol = $("vol");
    vol.value = Math.round(S.vol * 100);
    vol.oninput = () => { S.vol = vol.value / 100; store.set("vol", S.vol); };
    vol.onchange = () => playRoll(false); // preview chime on release

    mq.addEventListener("change", () => { if (S.theme === "auto") applyTheme(); });

    // resets (each asks first)
    $("rstBest").onclick = () => {
      if (!confirm("Reset your best roll?")) return;
      best = { name: "", points: -Infinity }; store.del("best"); updateBest();
    };
    $("rstHist").onclick = () => {
      if (!confirm("Clear your roll history?")) return;
      history = []; store.del("history"); renderData();
    };
    $("rstStats").onclick = () => {
      if (!confirm("Reset your stats? (also resets your pity)")) return;
      stats = { rolls: 0, sum: 0, seen: [] }; store.del("stats");
      pity = 0; store.del("pity"); updateLuck(); renderData();
    };
    $("rstColl").onclick = () => {
      if (!confirm("Reset your collection?")) return;
      coll = {}; store.save("coll", coll); updateColBtn(); renderData(); if (collOpen()) renderColl();
    };
    $("rstBadges").onclick = () => {
      if (!confirm("Reset your hidden badges?")) return;
      earned = {}; store.save("badges", earned); if (collOpen()) renderColl();
    };

    applyTheme(); applyAccent(); applySize();
    ["reveal", "num", "sound"].forEach(markSeg);
    renderData(); updateLuck(); updateColBtn();

    // panel open/close
    const panel = $("settings"), gear = $("gear");
    gear.onclick = e => { e.stopPropagation(); panel.classList.toggle("hidden"); };
    document.addEventListener("click", e => { if (!panel.contains(e.target) && e.target !== gear) panel.classList.add("hidden"); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") panel.classList.add("hidden"); });
  })();
</script>
</body>
</html>
