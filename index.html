<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arrascordle</title>
<script>try{if(localStorage.getItem('arrascordle-theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}
try{var s=JSON.parse(localStorage.getItem('arrascordle-settings'));if(s&&/^#[0-9a-f]{6}$/i.test(s.accent)){var h=s.accent,r=document.documentElement.style;r.setProperty('--accent',h);r.setProperty('--accent-rgb',parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16))}}catch(e){}</script>
<style>
  :root {
    --bg:#1f232a; --line:#343840; --card:#15181d; --btn:#171a1f; --btn-b:#1c2026; --btn-h:#1d2127; --btn-a:#12151a;
    --dis:#7d828b; --muted:#8d9096; --row:#181b20; --sub:#c3c8d3; --dash:#3a3f48; --dim:#6f747d; --fg:#fff;
    --pop:#15181d; --pop-b:#2a2f37; --accent:#e0247f; --accent-rgb:224,36,127; --tc:#8d9096; color-scheme: dark;
  }
  html[data-theme="light"] {
    --bg:#eef0f4; --line:#d5d9e0; --card:#ffffff; --btn:#f3f4f7; --btn-b:#d3d8e0; --btn-h:#e8ebf0; --btn-a:#dde1e8;
    --dis:#a0a6b0; --muted:#6b717c; --row:#f3f5f8; --sub:#4a505b; --dash:#b8bec9; --dim:#8a909a; --fg:#1b1f26;
    --pop:#ffffff; --pop-b:#d5d9e0; color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    background: var(--bg);
    border-top: 1px solid var(--line);
    color: var(--fg);
    font-family: "Noto Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    padding: 60px 16px 40px;
  }
  .hidden { display: none !important; }
  #status { margin-top: 14px; font-size: 14px; line-height: 20px; color: var(--muted); min-height: 20px; }
  #status.err { color: #e5484d; }
  #start .card { width: 270px; }

  /* ---------- start screen ---------- */
  #start { display: flex; justify-content: center; }
  .card { background: var(--card); border-radius: 8px; padding: 21px; text-align: center; }
  h1 { margin: 0 0 18px; font-size: 24px; font-weight: 700; line-height: 36px; letter-spacing: -.2px; }

  button {
    width: 100%; height: 48px;
    background: var(--btn); border: 1px solid var(--btn-b); border-radius: 4px;
    color: var(--fg); font: inherit; font-size: 17px; font-weight: 600;
    cursor: pointer; transition: background .15s;
  }
  button:hover:not(:disabled) { background: var(--btn-h); }
  button:active:not(:disabled) { background: var(--btn-a); }
  button:disabled { cursor: not-allowed; color: var(--dis); }
  #histBtnStart { margin-top: 12px; height: 40px; font-size: 15px; }

  /* ---------- result screen ---------- */
  #best {
    text-align: center; color: var(--muted); font-weight: 700; font-size: 18px;
    margin: -18px 0 22px; line-height: 28px; min-height: 28px;
  }
  .layout { display: flex; justify-content: center; align-items: flex-start; gap: 40px; flex-wrap: wrap; }
  .left { width: 250px; padding: 24px 21px 21px; transition: box-shadow .3s; }
  .left.glow { box-shadow: 0 0 26px color-mix(in srgb, var(--tc) 50%, transparent); }
  .left h2 { margin: 0 0 24px; font-size: 24px; line-height: 30px; font-weight: 700; word-break: break-word; }
  .img {
    width: 180px; height: 180px; margin: 0 auto 36px;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); border: 2px dashed var(--tc); border-radius: 50%;
    animation: spin 12s linear infinite;
    color: var(--dim); font-size: 15px; overflow: hidden;
  }
  .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .left button { margin-bottom: 14px; }
  .left button:last-child { margin-bottom: 0; }

  .right { width: 630px; max-width: 100%; padding: 20px; }
  .head { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 4px 0 20px; flex-wrap: wrap; }
  @property --a { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  .score {
    position: relative; font-size: 30px; font-weight: 300; color: var(--accent);
    text-shadow: 0 0 14px rgba(var(--accent-rgb),.45);
    padding: 4px 20px; border-radius: 16px; line-height: 38px;
  }
  /* comet trail orbiting the score */
  .score::before, .score::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 2px;
    background: conic-gradient(from var(--a), transparent 0deg, transparent 200deg,
      rgba(var(--accent-rgb),.25) 270deg, color-mix(in srgb, var(--accent), #fff 35%) 350deg, #fff 360deg);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    animation: orbit 2.4s linear infinite; pointer-events: none;
  }
  .score::after { filter: blur(6px); }
  @keyframes orbit { to { --a: 360deg; } }
  .rank {
    font-size: 15px; color: var(--tc); border: 1px solid var(--tc);
    border-radius: 10px; padding: 2px 14px; line-height: 26px;
  }
  .tier {
    font-size: 13px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase;
    padding: 4px 12px; border-radius: 10px; line-height: 20px; background: var(--tc); color: #111;
  }
  .tier.legendary {
    background: linear-gradient(90deg, #f5b301, #ffe58a, #f5b301); background-size: 200% 100%;
    animation: shine 2.2s linear infinite;
  }
  @keyframes shine { to { background-position: -200% 0; } }
  .ach {
    background: var(--row); border-radius: 8px; padding: 22px 20px;
    display: flex; justify-content: space-between; align-items: center; gap: 20px;
    margin-bottom: 20px; text-align: left;
  }
  .ach:last-child { margin-bottom: 0; }
  .ach .name { font-size: 22px; font-weight: 600; line-height: 30px; }
  .ach .desc { font-size: 18px; color: var(--sub); line-height: 30px; }
  .ach .pts { font-size: 18px; font-weight: 500; color: var(--sub); white-space: nowrap; }

  /* reveal animations */
  .shuffling #name, .shuffling #score { opacity: .75; }
  .fadein { animation: fadein .55s ease both; }
  @keyframes fadein { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  #flash {
    position: fixed; inset: 0; z-index: 15; pointer-events: none; opacity: 0;
    display: flex; justify-content: center; align-items: flex-start; padding-top: 16vh;
    background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--fc, #fff) 38%, transparent), transparent 62%);
    color: var(--fc, #fff); font-size: 28px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase;
    text-shadow: 0 2px 14px rgba(0,0,0,.45); text-align: center;
  }
  #flash.go { animation: flash 1.7s ease-out; }
  @keyframes flash { 0% { opacity: 0; transform: scale(.92); } 14% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }

  /* ---------- history ---------- */
  #histBox { width: 630px; max-width: 100%; margin: 24px auto 0; padding: 20px; text-align: left; }
  .hh { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .hh h2 { margin: 0; font-size: 20px; }
  .hh button { width: 36px; height: 36px; font-size: 15px; }
  .hrow {
    height: auto; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center;
    gap: 12px; margin-bottom: 8px; font-size: 16px; text-align: left; background: var(--row);
  }
  .hrow:last-child { margin-bottom: 0; }
  .hrow .l { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .hrow .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .hrow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hrow .r { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; color: var(--sub); font-weight: 500; }
  .hrow .r small { color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); font-size: 15px; padding: 6px 0; }

  /* ---------- settings ---------- */
  #gear { position: fixed; top: 14px; right: 14px; z-index: 20; width: 42px; height: 42px; padding: 0; font-size: 20px; line-height: 1; border-radius: 50%; }
  #settings {
    position: fixed; top: 64px; right: 14px; z-index: 20; width: 320px; max-width: calc(100vw - 28px);
    max-height: calc(100vh - 80px); overflow: auto;
    background: var(--pop); border: 1px solid var(--pop-b); border-radius: 10px; padding: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,.35); text-align: left;
  }
  #settings section { margin-bottom: 18px; }
  #settings section:last-child { margin-bottom: 0; }
  #settings h3 { margin: 0 0 8px; font-size: 13px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); }
  .seg { display: flex; gap: 8px; }
  .seg button { height: 36px; font-size: 14px; }
  .seg button.on { border-color: var(--accent); color: var(--accent); }
  .swatches { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .swatches .sw { width: 30px; height: 30px; padding: 0; border-radius: 50%; border: 0; }
  .swatches .sw.on { outline: 2px solid var(--fg); outline-offset: 2px; }
  #accentPick { width: 30px; height: 30px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; }
  #accentPick::-webkit-color-swatch-wrapper { padding: 0; }
  #accentPick::-webkit-color-swatch { border: 0; border-radius: 50%; }
  #accentPick::-moz-color-swatch { border: 0; border-radius: 50%; }
  .vol { display: flex; align-items: center; gap: 10px; margin-top: 10px; transition: opacity .15s; }
  .vol.off { opacity: .4; }
  .vol input { flex: 1; accent-color: var(--accent); }
  .vol span { width: 38px; text-align: right; font-size: 13px; color: var(--muted); }
  .dng { height: 36px; font-size: 14px; margin-bottom: 8px; }
  .dng:last-child { margin-bottom: 0; }
  .dng.armed { border-color: #e5484d; color: #e5484d; }

  @media (prefers-reduced-motion: reduce) {
    .img, .tier.legendary, .score::before, .score::after { animation: none; }
  }
</style>
</head>
<body>

  <!-- settings -->
  <button id="gear" title="Settings" aria-label="Settings">&#9881;</button>
  <div id="settings" class="hidden">
    <section>
      <h3>Theme</h3>
      <div class="seg">
        <button id="thDark" data-theme-btn="dark">Dark</button>
        <button id="thLight" data-theme-btn="light">Light</button>
      </div>
    </section>
    <section>
      <h3>Accent colour</h3>
      <div class="swatches" id="swatches">
        <input type="color" id="accentPick" title="Custom colour" aria-label="Custom accent colour">
      </div>
    </section>
    <section>
      <h3>Number format</h3>
      <div class="seg">
        <button data-set="numfmt" data-val="full">12,345</button>
        <button data-set="numfmt" data-val="compact">12.3K</button>
        <button data-set="numfmt" data-val="plain">12345</button>
      </div>
    </section>
    <section>
      <h3>Reveal animation</h3>
      <div class="seg">
        <button data-set="reveal" data-val="none">None</button>
        <button data-set="reveal" data-val="fade">Fade</button>
        <button data-set="reveal" data-val="slot">Slot</button>
      </div>
    </section>
    <section>
      <h3>Sound</h3>
      <div class="seg">
        <button data-set="sound" data-val="on">On</button>
        <button data-set="sound" data-val="off">Off</button>
      </div>
      <div class="vol" id="volRow">
        <input type="range" id="vol" min="0" max="100" step="1" aria-label="Volume">
        <span id="volv"></span>
      </div>
    </section>
    <section>
      <h3>Data</h3>
      <button class="dng" id="resetBest">Reset best roll</button>
      <button class="dng" id="resetHist">Clear roll history</button>
      <button class="dng" id="resetAll">Reset everything</button>
    </section>
  </div>

  <div id="flash"></div>

  <!-- start screen -->
  <div id="start">
    <div class="card">
      <h1>Arrascordle</h1>
      <button id="rollStart" disabled>Roll an user</button>
      <button id="histBtnStart" class="hidden">History</button>
      <div id="status"></div>
    </div>
  </div>

  <!-- result screen -->
  <div id="result" class="hidden">
    <div id="best"></div>
    <div class="layout" id="layout">
      <div class="card left" id="leftCard">
        <h2 id="name"></h2>
        <div class="img" id="img"></div>
        <button id="rollAgain">Roll Again</button>
        <button id="export">Export</button>
        <button id="shareImg">Share Image</button>
        <button id="histBtn">History</button>
      </div>
      <div class="card right">
        <div class="head">
          <div class="score" id="score"></div>
          <div class="rank" id="rank"></div>
          <div class="tier" id="tier"></div>
        </div>
        <div id="achs"></div>
      </div>
    </div>
  </div>

  <!-- history -->
  <div id="histBox" class="card hidden">
    <div class="hh"><h2>Roll history</h2><button id="histClose" aria-label="Close history">&#10005;</button></div>
    <div id="histList"></div>
  </div>

<script src="info/index.js"></script>
<script>
  /*
    Data layout:
      info/
        achievements.csv       <- master list: Achievements,Desc,Points
        users.csv              <- id,name,achievements  (achievements separated by ;)
        pfp/                   <- 1.png, 2.png, ... (file name = the user's id in users.csv)
    After editing anything in info/, run build.py -> regenerates info/index.js
  */
  const COOLDOWN = 3;  // seconds
  const MSG_POINTS = 1; // points per message sent
  const HIST_MAX = 20;  // rolls kept in history
  const SITE_URL = "https://shortcut1power.github.io/arrascordle/";
  const $ = id => document.getElementById(id);
  const rollAgain = $("rollAgain"), exportBtn = $("export"), shareBtn = $("shareImg"), statusEl = $("status");
  const LS = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} }
  };
  let USERS = [], current = null, last = null, timer = null, revealing = false;
  let best = { name: "", points: -Infinity };
  try { const b = JSON.parse(LS.get("arrascordle-best")); if (b && b.name) best = b; } catch {}
  // cooldown survives refresh: time (ms) when the next roll is allowed
  let nextAt = parseInt(LS.get("arrascordle-next")) || 0;
  nextAt = Math.min(nextAt, Date.now() + COOLDOWN * 1000); // ignore clock tampering

  // ---------- settings ----------
  const DEF = { accent: "#e0247f", numfmt: "full", reveal: "slot", sound: "on", volume: 50 };
  const PRESETS = [["Pink", "#e0247f"], ["Blue", "#3b82f6"], ["Green", "#22c55e"], ["Gold", "#f5b301"], ["Purple", "#8b5cf6"]];
  let S = { ...DEF };
  try {
    const s = JSON.parse(LS.get("arrascordle-settings")) || {};
    if (/^#[0-9a-f]{6}$/i.test(s.accent)) S.accent = s.accent.toLowerCase();
    if (["full", "compact", "plain"].includes(s.numfmt)) S.numfmt = s.numfmt;
    if (["none", "fade", "slot"].includes(s.reveal)) S.reveal = s.reveal;
    if (["on", "off"].includes(s.sound)) S.sound = s.sound;
    if (Number.isFinite(s.volume)) S.volume = Math.max(0, Math.min(100, Math.round(s.volume)));
  } catch {}
  const saveS = () => LS.set("arrascordle-settings", JSON.stringify(S));

  function applyAccent() {
    const h = S.accent, st = document.documentElement.style;
    st.setProperty("--accent", h);
    st.setProperty("--accent-rgb", [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)).join(","));
  }
  function setTheme(t) {
    document.documentElement.dataset.theme = t;
    LS.set("arrascordle-theme", t);
    document.querySelectorAll("[data-theme-btn]").forEach(b => b.classList.toggle("on", b.dataset.themeBtn === t));
  }

  // ---------- number format ----------
  const nfFull = new Intl.NumberFormat();
  const nfCompact = new Intl.NumberFormat("en", { notation: "compact", maximumFractionDigits: 1 });
  function fmt(n) {
    if (S.numfmt === "compact") return nfCompact.format(n);
    if (S.numfmt === "plain") return String(n);
    return nfFull.format(n);
  }
  const fmtSigned = n => (n >= 0 ? "+" : "") + fmt(n);

  // ---------- rarity tiers (by rank percentile, top rank is always Legendary) ----------
  const TIERS = [
    { id: "legendary", name: "Legendary", max: .05, color: "#f5b301" },
    { id: "epic",      name: "Epic",      max: .15, color: "#a855f7" },
    { id: "rare",      name: "Rare",      max: .35, color: "#3b82f6" },
    { id: "uncommon",  name: "Uncommon",  max: .65, color: "#22c55e" },
    { id: "common",    name: "Common",    max: Infinity, color: "#8d9096" }
  ];
  function tierOfRank(rank) {
    const p = (rank - 1) / Math.max(1, USERS.length);
    return TIERS.find(t => p < t.max);
  }

  // ---------- sound (synthesized, no files needed) ----------
  let ac = null;
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
    if (ac && ac.state === "suspended") ac.resume();
    return ac;
  }
  function tone(freq, dur, type, vol, when) {
    if (S.sound !== "on" || S.volume <= 0) return;
    const c = audio(); if (!c) return;
    const t = c.currentTime + (when || 0), o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(.0002, .3 * (S.volume / 100) * (vol || 1)), t + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + .03);
  }
  const NOTES = [523.25, 659.25, 783.99, 987.77, 1174.66, 1318.51];
  const sfx = {
    tick(p) { tone(380 + p * 520, .05, "square", .3); },
    reveal(ti) { // ti: 0 = legendary ... 4 = common
      const n = 5 - ti;
      for (let i = 0; i < n; i++) tone(NOTES[i], .35 + i * .05, "sine", 1, i * .09);
      if (ti === 0) tone(NOTES[5], .9, "triangle", .7, .45);
    },
    test() { tone(660, .15, "sine", 1); }
  };

  // ---------- CSV ----------
  function parseLine(line, d) {
    const out = []; let cur = "", q = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (q) { if (c === '"') { if (line[i+1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
      else if (c === '"') q = true;
      else if (c === d) { out.push(cur.trim()); cur = ""; }
      else cur += c;
    }
    out.push(cur.trim());
    return out;
  }
  function parseAchievements(text) {
    const lines = text.replace(/^﻿/, "").split(/\r?\n/).filter(l => l.trim());
    const rows = lines.map(l => {
      let r = [l.includes("\t") ? "\t" : l.includes(",") ? "," : l.includes(";") ? ";" : null]
        .map(d => d ? parseLine(l, d) : l.trim().split(/\s{2,}/))[0];
      return r;
    }).filter(r => r.length >= 2);
    const num = v => parseInt(String(v).replace(/[^\d-]/g, ""), 10);
    const out = [];
    rows.forEach((r, i) => {
      const pts = num(r[r.length - 1]);
      if (isNaN(pts)) { if (i === 0) return; /* header */ else return; }
      const name = r[0], desc = r.length > 2 ? r.slice(1, -1).join(", ") : "";
      out.push({ name, desc, pts });
    });
    return out;
  }

  // ---------- load (from info/index.js, made by build.py) ----------
  function parseList(text) {
    const names = text.replace(/^﻿/, "").split(/\r?\n/)
      .map(l => l.trim().replace(/^"(.*)"$/, "$1").trim()).filter(Boolean);
    if (names.length && /^achievements?$/i.test(names[0])) names.shift(); // header
    return names;
  }
  function init() {
    const data = window.INFO;
    if (!data || !Array.isArray(data.users) || !data.users.length) {
      statusEl.className = "err";
      statusEl.textContent = "No users found. Run build.py to generate info/index.js";
      return;
    }
    // master list: Achievements, Desc, Points
    const master = new Map(parseAchievements(data.master || "").map(a => [a.name.trim().toLowerCase(), a]));
    USERS = data.users.map(d => {
      const achievements = parseList(d.list || "").map(n => master.get(n.toLowerCase()) || { name: n, desc: "", pts: 0 })
        .sort((a, b) => b.pts - a.pts); // largest -> smallest
      const messages = parseInt(d.messages) || 0;
      if (messages > 0) achievements.unshift({ name: "Messages", desc: "", msgs: messages, pts: messages * MSG_POINTS });
      return { name: d.name, achievements, image: d.image ? encodeURI(d.image) : null,
               points: achievements.reduce((t, a) => t + a.pts, 0) };
    });
    USERS.forEach(u => u.rank = 1 + USERS.filter(o => o.points > u.points).length);
    $("rollStart").disabled = false;
  }
  applyAccent();
  init();
  if (nextAt > Date.now()) startCooldown();

  // ---------- render ----------
  function paintHead(u) {
    const t = tierOfRank(u.rank);
    $("result").style.setProperty("--tc", t.color);
    $("leftCard").classList.toggle("glow", t.id === "legendary" || t.id === "epic");
    $("name").textContent = u.name;
    $("score").textContent = fmt(u.points);
    $("rank").textContent = "#" + u.rank;
    const tr = $("tier"); tr.textContent = t.name; tr.className = "tier " + t.id;
    const img = $("img"); img.innerHTML = "";
    if (u.image) { const i = document.createElement("img"); i.src = u.image; i.alt = u.name; img.appendChild(i); }
    else img.textContent = "image";
  }
  function updateBest() {
    $("best").textContent = best.name ? `Best roll: ${best.name}(${fmt(best.points)})` : "";
  }
  function render(u) {
    paintHead(u);
    const box = $("achs"); box.innerHTML = "";
    u.achievements.forEach(a => {
      const row = document.createElement("div"); row.className = "ach";
      const l = document.createElement("div");
      const n = document.createElement("div"); n.className = "name"; n.textContent = a.name;
      const d = document.createElement("div"); d.className = "desc";
      d.textContent = a.msgs ? `Sent ${fmt(a.msgs)} messages in the server.` : a.desc;
      l.append(n, d);
      const p = document.createElement("div"); p.className = "pts"; p.textContent = fmtSigned(a.pts);
      row.append(l, p); box.appendChild(row);
    });
    updateBest();
  }
  function showResult() {
    $("start").classList.add("hidden");
    $("result").classList.remove("hidden");
  }

  function startCooldown() {
    clearInterval(timer);
    const tick = () => {
      const left = Math.ceil((nextAt - Date.now()) / 1000);
      if (left <= 0) {
        clearInterval(timer);
        rollAgain.disabled = false; rollAgain.textContent = "Roll Again";
        $("rollStart").disabled = !USERS.length; $("rollStart").textContent = "Roll an user";
      } else {
        rollAgain.disabled = true; rollAgain.textContent = `Roll Again (${left})`;
        $("rollStart").disabled = true; $("rollStart").textContent = `Roll an user (${left})`;
      }
    };
    tick();
    if (nextAt > Date.now()) timer = setInterval(tick, 250);
  }

  // ---------- history ----------
  let history = [];
  try {
    const h = JSON.parse(LS.get("arrascordle-history"));
    if (Array.isArray(h)) history = h.filter(x => x && x.n).slice(0, HIST_MAX);
  } catch {}
  function when(ts) {
    const d = new Date(ts), n = new Date();
    return d.toDateString() === n.toDateString()
      ? d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
      : d.toLocaleDateString([], { month: "short", day: "numeric" });
  }
  function pushHistory(u) {
    history.unshift({ n: u.name, p: u.points, r: u.rank, t: Date.now() });
    history.length = Math.min(history.length, HIST_MAX);
    LS.set("arrascordle-history", JSON.stringify(history));
    renderHistory();
  }
  function renderHistory() {
    $("histBtnStart").classList.toggle("hidden", !history.length);
    const box = $("histList"); box.innerHTML = "";
    if (!history.length) {
      const e = document.createElement("div"); e.className = "empty"; e.textContent = "No rolls yet.";
      box.appendChild(e); return;
    }
    history.forEach(h => {
      const u = USERS.find(x => x.name === h.n);
      const t = tierOfRank(u ? u.rank : h.r);
      const b = document.createElement("button"); b.className = "hrow"; b.disabled = !u;
      const l = document.createElement("span"); l.className = "l";
      const dot = document.createElement("span"); dot.className = "dot"; dot.style.background = t.color; dot.title = t.name;
      const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = h.n;
      l.append(dot, nm);
      const r = document.createElement("span"); r.className = "r";
      r.textContent = `${fmt(u ? u.points : h.p)} #${u ? u.rank : h.r}`;
      const tm = document.createElement("small"); tm.textContent = when(h.t); r.appendChild(tm);
      b.append(l, r);
      if (u) b.onclick = () => view(u);
      box.appendChild(b);
    });
  }
  function toggleHist(force) {
    const box = $("histBox");
    const open = force === undefined ? box.classList.contains("hidden") : force;
    box.classList.toggle("hidden", !open);
    if (open) box.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
  function view(u) { // re-open a past roll (no cooldown, no new history entry)
    if (revealing) return;
    current = u; render(u); showResult();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  $("histBtn").onclick = $("histBtnStart").onclick = () => toggleHist();
  $("histClose").onclick = () => toggleHist(false);

  // ---------- rolling + reveal ----------
  function flash(t) {
    if (t.id !== "legendary" && t.id !== "epic") return;
    const f = $("flash");
    f.style.setProperty("--fc", t.color);
    f.textContent = t.id === "legendary" ? "✦ Legendary roll ✦" : "Epic roll!";
    f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
  }
  function commit(u) {
    current = u;
    if (u.points > best.points) {
      best = { name: u.name, points: u.points };
      LS.set("arrascordle-best", JSON.stringify(best));
    }
    pushHistory(u);
    render(u);
    const t = tierOfRank(u.rank);
    if (S.reveal === "fade") {
      const l = $("layout"); l.classList.remove("fadein"); void l.offsetWidth; l.classList.add("fadein");
    }
    if (S.reveal !== "none") flash(t);
    sfx.reveal(TIERS.indexOf(t));
  }
  function reveal(u) {
    if (S.reveal === "slot" && USERS.length > 1) {
      revealing = true; current = null;
      $("achs").innerHTML = ""; $("result").classList.add("shuffling");
      const steps = 14; let i = 0, prev = null;
      const step = () => {
        if (i >= steps) { $("result").classList.remove("shuffling"); revealing = false; commit(u); return; }
        let r; do { r = USERS[Math.floor(Math.random() * USERS.length)]; } while (r === prev);
        prev = r; paintHead(r); sfx.tick(i / steps); i++;
        setTimeout(step, 40 + .6 * i * i);
      };
      step();
    } else commit(u);
  }
  function roll() {
    if (!USERS.length || revealing || Date.now() < nextAt) return;
    let pool = USERS.length > 1 ? USERS.filter(u => u !== last) : USERS;
    const u = last = pool[Math.floor(Math.random() * pool.length)];
    nextAt = Date.now() + COOLDOWN * 1000;
    LS.set("arrascordle-next", String(nextAt));
    showResult();
    startCooldown();
    reveal(u);
  }

  $("rollStart").onclick = roll;
  rollAgain.onclick = () => { if (!rollAgain.disabled) roll(); };

  // ---------- export: text ----------
  function flashBtn(btn, text) {
    const orig = btn.dataset.label || (btn.dataset.label = btn.textContent);
    btn.textContent = text;
    setTimeout(() => btn.textContent = orig, 1200);
  }
  exportBtn.onclick = async () => {
    if (!current || revealing) return;
    const extra = current.achievements.length - 3;
    const text =
      `**${current.name}**\n${fmt(current.points)} score #${current.rank} (${tierOfRank(current.rank).name})\n\n` +
      current.achievements.slice(0, 3).map(a => `${a.name} ${fmtSigned(a.pts)}`).join("\n") +
      (extra > 0 ? `\n+${extra} more badge${extra > 1 ? "s" : ""}` : "") +
      "\n\nArrascordle\n" + SITE_URL;
    try { await navigator.clipboard.writeText(text); }
    catch {
      const t = document.createElement("textarea");
      t.value = text; document.body.appendChild(t); t.select();
      document.execCommand("copy"); t.remove();
    }
    flashBtn(exportBtn, "Copied!");
  };

  // ---------- export: image card ----------
  function rr(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  function fit(c, text, maxW) {
    if (c.measureText(text).width <= maxW) return text;
    while (text.length > 1 && c.measureText(text + "…").width > maxW) text = text.slice(0, -1);
    return text + "…";
  }
  function loadImg(src) {
    return new Promise(res => {
      if (!src) return res(null);
      const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src;
    });
  }
  function drawCard(u, avatar) {
    const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
    const W = 1000, H = 520, K = 2, FONT = '"Noto Sans","Segoe UI",system-ui,sans-serif';
    const cv = document.createElement("canvas"); cv.width = W * K; cv.height = H * K;
    const c = cv.getContext("2d"); c.scale(K, K);
    const t = tierOfRank(u.rank), accent = v("--accent");
    c.fillStyle = v("--bg"); c.fillRect(0, 0, W, H);
    c.fillStyle = v("--card"); rr(c, 20, 20, W - 40, H - 40, 20); c.fill();
    c.textBaseline = "alphabetic";

    // avatar
    const cx = 260, cy = 170, R = 92;
    c.save(); c.beginPath(); c.arc(cx, cy, R, 0, Math.PI * 2); c.clip();
    c.fillStyle = v("--bg"); c.fillRect(cx - R, cy - R, R * 2, R * 2);
    if (avatar) {
      const s = Math.max(R * 2 / avatar.width, R * 2 / avatar.height), w = avatar.width * s, h = avatar.height * s;
      c.drawImage(avatar, cx - w / 2, cy - h / 2, w, h);
    } else {
      c.fillStyle = v("--dim"); c.font = `700 72px ${FONT}`; c.textAlign = "center";
      c.fillText((u.name[0] || "?").toUpperCase(), cx, cy + 25);
    }
    c.restore();
    c.lineWidth = 6; c.strokeStyle = t.color; c.beginPath(); c.arc(cx, cy, R + 6, 0, Math.PI * 2); c.stroke();

    // name / score / rank / tier
    c.textAlign = "center"; c.fillStyle = v("--fg"); c.font = `700 34px ${FONT}`;
    c.fillText(fit(c, u.name, 400), cx, 320);
    c.fillStyle = accent; c.font = `300 56px ${FONT}`;
    c.fillText(fmt(u.points), cx, 386);
    c.font = `600 17px ${FONT}`;
    const rk = "#" + u.rank, tn = t.name.toUpperCase();
    const rw = c.measureText(rk).width + 28, tw = c.measureText(tn).width + 28, gap = 12, x0 = cx - (rw + tw + gap) / 2;
    c.strokeStyle = t.color; c.lineWidth = 1.5; rr(c, x0, 410, rw, 34, 10); c.stroke();
    c.fillStyle = t.color; c.fillText(rk, x0 + rw / 2, 433);
    c.fillStyle = t.color; rr(c, x0 + rw + gap, 410, tw, 34, 10); c.fill();
    c.fillStyle = "#111"; c.fillText(tn, x0 + rw + gap + tw / 2, 433);

    // achievements
    const X = 530, RW = 430;
    c.textAlign = "left"; c.fillStyle = v("--muted"); c.font = `700 14px ${FONT}`;
    c.fillText("TOP ACHIEVEMENTS", X, 70);
    const top = u.achievements.slice(0, 3);
    top.forEach((a, i) => {
      const y = 90 + i * 98, desc = a.msgs ? `Sent ${fmt(a.msgs)} messages in the server.` : a.desc;
      c.fillStyle = v("--row"); rr(c, X, y, RW, 84, 12); c.fill();
      const pts = fmtSigned(a.pts);
      c.font = `500 22px ${FONT}`; const pw = c.measureText(pts).width;
      c.fillStyle = v("--sub"); c.textAlign = "right"; c.fillText(pts, X + RW - 20, y + (desc ? 34 : 49));
      c.textAlign = "left"; c.fillStyle = v("--fg"); c.font = `600 24px ${FONT}`;
      c.fillText(fit(c, a.name, RW - 60 - pw), X + 20, y + (desc ? 34 : 49));
      if (desc) { c.fillStyle = v("--sub"); c.font = `400 16px ${FONT}`; c.fillText(fit(c, desc, RW - 40), X + 20, y + 62); }
    });
    if (!top.length) { c.fillStyle = v("--muted"); c.font = `400 18px ${FONT}`; c.fillText("No achievements yet", X, 120); }
    const extra = u.achievements.length - 3;
    if (extra > 0) {
      c.fillStyle = v("--muted"); c.font = `600 20px ${FONT}`;
      c.fillText(`+${extra} more badge${extra > 1 ? "s" : ""}`, X, 90 + 3 * 98 + 12);
    }

    // footer
    c.fillStyle = v("--fg"); c.font = `700 20px ${FONT}`; c.fillText("Arrascordle", X, H - 48);
    c.fillStyle = v("--muted"); c.font = `400 14px ${FONT}`; c.fillText(SITE_URL.replace(/^https?:\/\//, ""), X + 124, H - 48);
    return cv;
  }
  async function cardBlob(u) {
    const av = await loadImg(u.image);
    const toB = cv => new Promise((res, rej) => {
      try { cv.toBlob(b => b ? res(b) : rej(new Error("no blob")), "image/png"); } catch (e) { rej(e); }
    });
    try { return await toB(drawCard(u, av)); }
    catch { return await toB(drawCard(u, null)); } // tainted canvas (e.g. opened from file://): draw without avatar
  }
  shareBtn.onclick = async () => {
    if (!current || revealing) return;
    const u = current, p = cardBlob(u);
    let msg = "Copied!";
    try { await navigator.clipboard.write([new ClipboardItem({ "image/png": p })]); }
    catch {
      try {
        const b = await p, a = document.createElement("a");
        a.href = URL.createObjectURL(b);
        a.download = "arrascordle-" + u.name.replace(/[^\w-]+/g, "_") + ".png";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        msg = "Saved!";
      } catch { msg = "Failed"; }
    }
    flashBtn(shareBtn, msg);
  };

  // ---------- settings UI ----------
  function refreshUI() {
    if (!revealing) { if (current) render(current); else updateBest(); }
    renderHistory();
  }
  function syncSettingsUI() {
    document.querySelectorAll("[data-set]").forEach(b => b.classList.toggle("on", S[b.dataset.set] === b.dataset.val));
    document.querySelectorAll("#swatches .sw").forEach(b => b.classList.toggle("on", b.dataset.hex === S.accent));
    $("accentPick").value = S.accent;
    $("vol").value = S.volume; $("volv").textContent = S.volume + "%";
    $("volRow").classList.toggle("off", S.sound !== "on");
  }
  function setAccent(hex) { S.accent = hex.toLowerCase(); applyAccent(); saveS(); syncSettingsUI(); }

  PRESETS.forEach(([name, hex]) => {
    const b = document.createElement("button");
    b.className = "sw"; b.style.background = hex; b.dataset.hex = hex; b.title = name; b.setAttribute("aria-label", name + " accent");
    b.onclick = () => setAccent(hex);
    $("swatches").insertBefore(b, $("accentPick"));
  });
  $("accentPick").oninput = e => setAccent(e.target.value);

  document.querySelectorAll("[data-set]").forEach(b => b.onclick = () => {
    S[b.dataset.set] = b.dataset.val; saveS(); syncSettingsUI();
    if (b.dataset.set === "numfmt") refreshUI();
    if (b.dataset.set === "sound") sfx.test();
  });
  $("vol").oninput = e => { S.volume = parseInt(e.target.value) || 0; $("volv").textContent = S.volume + "%"; saveS(); };
  $("vol").onchange = () => sfx.test();

  document.querySelectorAll("[data-theme-btn]").forEach(b => b.onclick = () => setTheme(b.dataset.themeBtn));
  setTheme(document.documentElement.dataset.theme === "light" ? "light" : "dark");

  // two-step confirm for destructive buttons
  function armed(btn, fn) {
    const label = btn.textContent; let t = null;
    btn.onclick = () => {
      if (t) { clearTimeout(t); t = null; btn.textContent = label; btn.classList.remove("armed"); fn(); return; }
      btn.textContent = "Click again to confirm"; btn.classList.add("armed");
      t = setTimeout(() => { t = null; btn.textContent = label; btn.classList.remove("armed"); }, 3000);
    };
  }
  const resetBest = () => { best = { name: "", points: -Infinity }; LS.del("arrascordle-best"); updateBest(); };
  const clearHistory = () => { history = []; LS.del("arrascordle-history"); renderHistory(); };
  armed($("resetBest"), resetBest);
  armed($("resetHist"), clearHistory);
  armed($("resetAll"), () => {
    resetBest(); clearHistory();
    S = { ...DEF }; LS.del("arrascordle-settings");
    applyAccent(); setTheme("dark"); syncSettingsUI(); refreshUI();
  });

  // panel open/close
  (function () {
    const panel = $("settings"), gear = $("gear");
    gear.onclick = e => { e.stopPropagation(); panel.classList.toggle("hidden"); };
    document.addEventListener("click", e => { if (!panel.contains(e.target) && e.target !== gear) panel.classList.add("hidden"); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") panel.classList.add("hidden"); });
  })();

  syncSettingsUI();
  renderHistory();
</script>
</body>
</html>
